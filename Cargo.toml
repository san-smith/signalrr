[package]
name = "signalrr"
version = "0.1.0-alpha.2"
edition = "2024"
description = "Rust client for ASP.NET Core SignalR with MessagePack and custom protocol support"
repository = "https://github.com/san-smith/signalrr"
license = "MIT OR Apache-2.0"
keywords = ["signalr", "websocket", "messagepack", "realtime"]
categories = ["network-programming", "api-bindings"]

[features]
default = ["json", "messagepack"]
json = []
messagepack = ["dep:rmp", "dep:rmpv", "dep:rmp-serde"]
messagepack-brotli = ["messagepack", "dep:brotli"]
# In-process fake hub for tests of code built on this client (`signalrr::test_support`).
test-support = ["tokio/io-util"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rmp = { version = "0.8", optional = true }
rmpv = { version = "1.3", optional = true, features = ["with-serde"] }
rmp-serde = { version = "1", optional = true }

tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
url = "2.5"
# native-tls instead of the default rustls with aws-lc-rs: no C toolchain for the Windows
# target on Linux and macOS.
reqwest = { version = "0.13", default-features = false, features = [
    "json", "native-tls", "charset", "http2", "system-proxy",
] }
futures-util = "0.3"
futures-channel = "0.3"
tracing = "0.1"
brotli = { version = "9.1", optional = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
insta = "1.49"
criterion = { version = "0.8", default-features = false }

[[example]]
name = "connect"
required-features = []

[[example]]
name = "record"
required-features = ["messagepack-brotli"]

[[bench]]
name = "typed_receive"
harness = false
required-features = ["messagepack-brotli"]

[[test]]
name = "connect"
required-features = ["messagepack-brotli", "test-support"]

[[test]]
name = "reconnect"
required-features = ["messagepack-brotli", "test-support"]
