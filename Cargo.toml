[package]
name = "signalrr"
version = "0.0.0"
edition = "2024"
description = "Rust client for ASP.NET Core SignalR with MessagePack and custom protocol support"
repository = "https://github.com/san-smith/signalrr"
license = "MIT OR Apache-2.0"
keywords = ["signalr", "websocket", "messagepack", "realtime"]
categories = ["network-programming", "api-bindings"]

[features]
default = ["json", "messagepack"]
json = []
messagepack = ["dep:rmp", "dep:rmpv"]
messagepack-brotli = ["messagepack", "dep:brotli"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rmp = { version = "0.8", optional = true }
rmpv = { version = "1.3", optional = true, features = ["with-serde"] }

tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
url = "2.5"
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
futures-channel = "0.3"
tracing = "0.1"
brotli = { version = "5.0", optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"

[[example]]
name = "connect"
required-features = []
